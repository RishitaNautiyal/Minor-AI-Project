<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OffGrid</title>

    <!--
        This is the project's entry point.
        Anybody who opens the site lands here first.

        We don't render anything here — we just decide
        where to send the visitor:

        - Not logged in  -> login.html
        - Already logged in -> main.html (login.html
          itself also checks this on load, so this is a
          fast-path redirect to avoid a flash of the login
          form for returning, already-authenticated users)
    -->

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0D1620;
            color: #8FA3AC;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>

    Loading OffGrid&hellip;

    <script type="module">

        import { auth } from "./firebase-config.js";

        import { onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // Redirect as soon as we know the auth state,
        // so this page is never shown for more than an instant.

        onAuthStateChanged(auth, function (user) {

            if (user) {

                window.location.replace("main.html");

            } else {

                window.location.replace("login.html");

            }

        });

        // Safety net: if Firebase is slow to respond
        // (e.g. offline / misconfigured), don't leave
        // the visitor stuck on a blank loading screen.

        setTimeout(function () {

            window.location.replace("login.html");

        }, 4000);

    </script>

</body>
</html>
